name: ci
on: [push, pull_request]
jobs:
  test:
    # Fast checks on every push: data integrity, evaluation maths, the committed INT8 model and the API.
    # Full retraining (run_all.sh, ~70 CPU-minutes) is run by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - run: scripts/fetch_data.sh
      - run: python -m pytest -q tests
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f serve/Dockerfile -t clearscan .
      - run: |
          docker run -d -p 8000:8000 --name cs clearscan && sleep 8
          curl -fsS localhost:8000/health
